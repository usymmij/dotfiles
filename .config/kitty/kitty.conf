# vim:ft=kitty

include ./theme.conf

# Close the terminal without confirmation
confirm_os_window_close 0
paste_actions filter
clipboard_control write-clipboard write-primary read-clipboard read-primary

#shell_integration no-title
enabled_layouts tall:bias=60;full_size=1;mirrored=false, fat:bias=50;full_size=1;mirrored=false, splits:split_axis=horizontal

map f9 next_layout
map f10 launch --location=split --cwd=current
map f11 launch --type=tab --cwd=current
map f12 launch --type=tab 

map alt+shift+h resize_window narrower 3
map alt+shift+l resize_window wider 3
map alt+shift+k resize_window taller 3
map alt+shift+j resize_window shorter 3

map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

map ctrl+shift+h prev_tab
map ctrl+shift+l next_tab 
